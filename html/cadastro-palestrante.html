<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Cadastro palestrante</title>
 
    <link rel="stylesheet" href="/css/style.css">
</head>
 
<body>
 
    <header class="cabecalho">
 
        <h1>Gerenciador de eventos</h1>
 
        <nav>
            <a href="cadastro-palestrante.html">
                Cadastro de Palestrantes
            </a>
 
            <a href="cadastro-evento.html">
                Cadastro de Eventos
            </a>
 
            <a href="index.html">
                Gerenciador de Eventos
            </a>
        </nav>
 
    </header>
 
 
    <main>
 
        <h2>Cadastro palestrante</h2>
 
        <form id="form-palestrante">
 
            <div class="campo">
 
                <label for="nome">
                    Nome
                </label>
 
                <input type="text" id="nome" name="nome" required>
 
            </div>
 
 
            <div class="campo">
 
                <label for="email">
                    E-mail
                </label>
 
                <input type="email" id="email" name="email" required>
 
            </div>
 
 
            <button type="submit" class="botao-principal">
                Cadastrar
            </button>
 
        </form>
 
    </main>
 
 
    <script src="/js/palestrante.js"></script>
 
</body>
 
</html>
